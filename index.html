<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بطاقة حب</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 350px;
        }
        h1 {
            color: #DC2626;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .ar{
            color: #DC2626;
        }
        .ra{
            color: #ffffff;
        }
        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background-color: #DC2626;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: blueviolet ;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="photo.jpg" alt="صورة لنا" class="card-img">
        <h1>Anas Rajy</h1>
        <h1 class="ar">&</h1>
        <h1 class="ar">Raghad Magdy</h1>
        <p>حبيت يكون اول موقع بعمله لحبيبتي يكون </p>
        <a href="love.html" class="btn"> موافقة تتزوجيني ؟!</a>
    </div>

</body>
</html>
